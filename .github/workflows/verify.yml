name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm --filter @unmute/frontend exec playwright install --with-deps chromium
      - name: Prepare disposable auth fixture
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          writeFileSync('backend/.dev.vars', [
            'BETTER_AUTH_URL=http://localhost:5173',
            `BETTER_AUTH_SECRET=${randomBytes(32).toString('base64')}`,
            'GOOGLE_CLIENT_ID=ci-only.apps.googleusercontent.com',
            'GOOGLE_CLIENT_SECRET=ci-only-not-a-real-oauth-secret',
          ].join('\n'), { mode: 0o600 });
          NODE
          pnpm --filter @unmute/backend db:migrate:local
      - run: pnpm --filter @unmute/frontend test:e2e
